<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Race — Pocket Arcade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@500;650;800&display=swap');
:root{--paper:#f5e9d0;--navy:#10243b;--orange:#f05a30;--blue:#3d8bd4;--yellow:#ffc93c;--green:#72b987;--edge:#10243b}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--blue);color:var(--navy);font-family:Figtree,sans-serif;padding:18px;background-image:radial-gradient(rgba(16,36,59,.18) 1.4px,transparent 1.4px);background-size:18px 18px}
.cabinet{max-width:1260px;height:calc(100vh - 36px);min-height:680px;margin:auto;background:var(--paper);border:3px solid var(--edge);border-radius:28px;box-shadow:9px 9px 0 var(--edge);overflow:hidden;display:grid;grid-template-rows:85px 1fr}
header{display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:3px solid var(--edge);background:var(--yellow)}.logo{font:27px "Bowlby One";letter-spacing:-.04em;transform:rotate(-2deg)}.logo span{color:var(--orange)}.badge{border:2px solid var(--edge);border-radius:99px;background:var(--paper);padding:8px 13px;font-size:11px;font-weight:800;text-transform:uppercase;box-shadow:3px 3px 0 var(--edge)}
main{display:grid;grid-template-columns:330px 1fr;min-height:0}.controls{padding:24px;border-right:3px solid var(--edge);overflow:auto}.controls h1{font:31px/.95 "Bowlby One";margin:0 0 10px;letter-spacing:-.035em}.controls p{font-size:13px;line-height:1.45;margin:0 0 20px}.label{display:flex;justify-content:space-between;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.label span{color:var(--orange)}
textarea{width:100%;height:142px;border:2px solid var(--edge);border-radius:12px;background:#fffaf0;padding:12px;font:650 13px/1.55 Figtree;resize:none;outline:none;box-shadow:4px 4px 0 var(--edge)}textarea:focus{box-shadow:4px 4px 0 var(--orange)}
.switches{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.switch{border:2px solid var(--edge);border-radius:10px;background:transparent;padding:11px 8px;font:800 10px Figtree;text-transform:uppercase;cursor:pointer}.switch.active{background:var(--navy);color:var(--paper);transform:translate(2px,2px);box-shadow:none}.go{width:100%;border:3px solid var(--edge);border-radius:50%;aspect-ratio:1.9;background:var(--orange);color:#fff;font:20px "Bowlby One";text-transform:uppercase;cursor:pointer;box-shadow:0 8px 0 #9f351d;transition:.12s}.go:active{transform:translateY(6px);box-shadow:0 2px 0 #9f351d}
.machine{min-width:0;display:grid;grid-template-columns:1fr 220px;background:#d8e7e0}.playfield{position:relative;overflow:hidden;border-right:3px solid var(--edge);background:linear-gradient(165deg,#ecf3e8,#c8ddd4)}.playfield:before{content:"";position:absolute;inset:20px;border:3px solid var(--edge);border-radius:25px;box-shadow:inset 0 0 0 8px rgba(255,255,255,.45)}
.ramp{position:absolute;left:50%;top:8%;width:min(410px,75%);height:78%;transform:translateX(-50%)}.loop{position:absolute;border:17px solid var(--navy);border-left-color:transparent;border-radius:50%;height:95px;transform:rotate(12deg)}.loop.a{top:0;left:5%;right:5%}.loop.b{top:22%;left:15%;right:0;transform:rotate(-12deg)}.loop.c{top:45%;left:0;right:22%}.funnel{position:absolute;top:64%;left:22%;right:13%;height:95px;background:var(--yellow);border:3px solid var(--edge);clip-path:polygon(0 0,100% 0,57% 100%,43% 100%)}.cup{position:absolute;bottom:0;left:38%;width:90px;height:36px;background:var(--orange);border:3px solid var(--edge);border-radius:0 0 45px 45px}.pin{position:absolute;width:14px;height:14px;border:2px solid var(--edge);background:var(--orange);border-radius:50%}.p1{top:55%;left:25%}.p2{top:53%;left:48%}.p3{top:58%;left:70%}.p4{top:67%;left:40%}.p5{top:65%;left:61%}
.ball{position:absolute;top:6%;left:50%;width:22px;height:22px;border:2px solid var(--edge);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--c) 23%);z-index:5;transition:top 2.9s cubic-bezier(.36,.08,.66,1),left 2.9s ease-in-out,transform 2.9s}.ball.run{top:90%;left:calc(50% + var(--x));transform:rotate(940deg)}
.ticker{position:absolute;left:38px;top:38px;background:var(--paper);border:2px solid var(--edge);padding:8px 12px;border-radius:9px;box-shadow:3px 3px 0 var(--edge);font-size:10px;font-weight:800;text-transform:uppercase;z-index:6}.ticker b{color:var(--orange)}
.score{padding:21px 16px;background:var(--navy);color:var(--paper);overflow:auto}.score h2{font:16px "Bowlby One";margin:0 0 15px;color:var(--yellow)}.row{display:grid;grid-template-columns:23px 15px 1fr;gap:7px;align-items:center;border-top:1px dashed rgba(255,255,255,.24);padding:10px 0;font-size:11px;font-weight:700}.num{color:var(--yellow)}.dot{width:13px;height:13px;border-radius:50%;background:var(--c);border:1px solid #fff}.score small{display:block;color:#9eb3c9;line-height:1.5;margin-top:18px}
.result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(16,36,59,.78);z-index:20;opacity:0;pointer-events:none;transition:.25s}.result.show{opacity:1;pointer-events:auto}.ticket{position:relative;width:min(530px,90vw);background:var(--yellow);border:3px solid var(--edge);padding:45px 35px;text-align:center;box-shadow:10px 10px 0 var(--edge);transform:rotate(-1.5deg)}.ticket:before,.ticket:after{content:"";position:absolute;width:30px;height:30px;border:3px solid var(--edge);background:var(--navy);border-radius:50%;top:50%;transform:translateY(-50%)}.ticket:before{left:-18px}.ticket:after{right:-18px}.ticket small{font-weight:800;text-transform:uppercase;letter-spacing:.16em}.ticket h2{font:48px/.95 "Bowlby One";margin:12px 0 25px;color:var(--orange)}.ticket button{border:2px solid var(--edge);border-radius:9px;background:var(--paper);padding:11px 18px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
@media(max-width:850px){.cabinet{height:auto;min-height:calc(100vh - 36px)}main{grid-template-columns:1fr}.controls{border-right:0;border-bottom:3px solid var(--edge)}.controls h1,.controls p{display:none}.machine{height:520px}.score{display:none}}@media(max-width:520px){body{padding:7px}.cabinet{height:calc(100vh - 14px)}header{padding:0 16px}.logo{font-size:20px}.machine{grid-template-columns:1fr}.controls{padding:15px}.playfield:before{inset:10px}}
</style>
</head>
<body>
<div class="cabinet"><header><div class="logo">MARBLE <span>MAYHEM!</span></div><div class="badge">100% gravity powered</div></header>
<main><section class="controls"><h1>Who gets picked?</h1><p>Load the crew, choose the rule, then smack the big red button.</p><div class="label"><label for="names2">Players</label><span id="count">5 / 15</span></div><textarea id="names2">Avery
Jordan
Morgan
Riley
Sam</textarea><div class="switches"><button class="switch active" data-mode="first">First marble</button><button class="switch" data-mode="last">Last marble</button></div><button class="go" id="go">Drop 'em</button></section>
<section class="machine"><div class="playfield"><div class="ticker">Status: <b id="status">Insert names</b></div><div class="ramp"><i class="loop a"></i><i class="loop b"></i><i class="loop c"></i><i class="funnel"></i><i class="cup"></i><i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i><i class="pin p4"></i><i class="pin p5"></i><div id="balls"></div></div></div><aside class="score"><h2>Score board</h2><div id="players"></div><small id="rule">First one in the cup wins. Race ends immediately.</small></aside></section></main></div>
<div class="result" id="result2"><div class="ticket"><small id="resultLabel2">The winner is</small><h2 id="winner2">—</h2><button id="again2">Play another round</button></div></div>
<script>
const palette=['#ef5a32','#4f99dc','#f5c72e','#76ba88','#a778c9','#ed8ab4'];let mode='first';const input=document.querySelector('#names2');
function getNames(){return input.value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,15)}function paint(){const ns=getNames();document.querySelector('#count').textContent=`${ns.length} / 15`;document.querySelector('#players').innerHTML=ns.map((n,i)=>`<div class="row"><span class="num">${i+1}</span><i class="dot" style="--c:${palette[i%palette.length]}"></i><span>${n}</span></div>`).join('');document.querySelector('#balls').innerHTML=ns.map((_,i)=>`<i class="ball" style="--c:${palette[i%palette.length]};--x:${(i%2?-1:1)*(i*7)}px;transition-delay:${i*.07}s"></i>`).join('')}input.oninput=paint;paint();
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#rule').textContent=mode==='first'?'First one in the cup wins. Race ends immediately.':'Everyone must finish. The last one in the cup is selected.'});
document.querySelector('#go').onclick=()=>{const ns=getNames();if(ns.length<2)return;document.querySelector('#status').textContent='marbles loose!';document.querySelectorAll('.ball').forEach(x=>x.classList.add('run'));setTimeout(()=>{const chosen=mode==='first'?ns[0]:ns.at(-1);document.querySelector('#resultLabel2').textContent=mode==='first'?'The winner is':'The last finisher is';document.querySelector('#winner2').textContent=chosen;document.querySelector('#result2').classList.add('show')},3300)};document.querySelector('#again2').onclick=()=>{document.querySelector('#result2').classList.remove('show');document.querySelector('#status').textContent='insert names';document.querySelectorAll('.ball').forEach(x=>x.classList.remove('run'))};
</script></body></html>
